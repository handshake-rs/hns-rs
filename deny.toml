[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "NCSA",
    "Unicode-3.0",
]

[licenses.private]
# The non-publishable fuzz harness is covered by the workspace source license;
# published protocol crates must continue to carry explicit license metadata.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
