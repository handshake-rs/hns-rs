[package]
name = "hns-swap"
description = "HIP-0001 and Shakedex-compatible atomic name-swap primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/hns-swap"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
blake2.workspace = true
hns-covenants.workspace = true
hns-encoding.workspace = true
hns-primitives.workspace = true
hns-script.workspace = true
hns-transaction.workspace = true
k256.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
bech32 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
# Shakedex v2 auction JSON, the format LearnHNS Market, Bob Wallet and the
# shakedex CLI exchange. Off by default so the core primitives stay free of
# serde and bech32.
shakedex-json = ["dep:bech32", "dep:hex", "dep:serde", "dep:serde_json"]

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true
